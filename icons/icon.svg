<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="96" fill="#d01012"/>
  <g transform="translate(96 150)">
    <!-- LEGO brick body -->
    <rect x="0" y="40" width="320" height="180" rx="18" fill="#f5c518"/>
    <!-- studs -->
    <g fill="#f5c518" stroke="#caa00f" stroke-width="6">
      <ellipse cx="70"  cy="40" rx="42" ry="22"/>
      <ellipse cx="160" cy="40" rx="42" ry="22"/>
      <ellipse cx="250" cy="40" rx="42" ry="22"/>
    </g>
    <rect x="0" y="40" width="320" height="180" rx="18" fill="none" stroke="#caa00f" stroke-width="6"/>
    <!-- shine -->
    <rect x="18" y="64" width="284" height="40" rx="14" fill="#ffffff" opacity="0.25"/>
  </g>
  <text x="256" y="420" font-family="Arial, sans-serif" font-size="74" font-weight="bold"
        fill="#ffffff" text-anchor="middle" letter-spacing="2">LEGO-LAND</text>
</svg>
