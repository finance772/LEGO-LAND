<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#d01012" />
  <meta name="description" content="מערכת ניהול מכירות לגו - מלאי, חיוב, אריזה, משלוח ודוחות" />
  <title>LEGO-LAND · ניהול מכירות</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="LEGO-LAND" />
  <meta name="mobile-web-app-capable" content="yes" />

  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- Early diagnostic: surface any boot error visibly instead of a dead screen -->
  <script>
    window.__legoErr = function (msg) {
      var b = document.getElementById('bootErr');
      if (!b) {
        b = document.createElement('div'); b.id = 'bootErr';
        b.style.cssText = 'position:fixed;inset-inline:0;top:0;z-index:9999;background:#d01012;color:#fff;padding:10px 14px;font:14px/1.4 Arial;direction:rtl';
        document.body.appendChild(b);
      }
      b.textContent = '⚠ שגיאה בטעינה: ' + msg + ' — נסה לפתוח את הקובץ בדפדפן Chrome/Safari (לא בתצוגה מקדימה).';
    };
    window.addEventListener('error', function (e) { window.__legoErr(e.message || e.error); });
  </script>

  <!-- App bar -->
  <header class="appbar">
    <div class="appbar__brand">
      <span class="brick brick--red"></span>
      <span class="brick brick--yellow"></span>
      <span class="brick brick--blue"></span>
      <h1>LEGO-LAND</h1>
    </div>
    <div class="appbar__right">
      <span id="liveClock" class="clock" aria-live="polite"></span>
      <button id="installBtn" class="btn btn--ghost" hidden>⬇ הורד למסך הבית</button>
    </div>
  </header>

  <!-- Greeting -->
  <section class="greeting" id="greeting">
    <h2 class="greeting__title"><span id="greetUser">דויד</span> שלום 👋</h2>
    <p class="greeting__sub">ברוך הבא למרכז הבקרה של מכירות הלגו. כל השרשרת - מהזמנה ועד מסירה - במקום אחד.</p>
  </section>

  <!-- KPI strip -->
  <section class="kpis" id="kpis"></section>

  <!-- Recent LEGO series showcase -->
  <section class="showcase" id="showcase"></section>

  <!-- Main navigation buttons -->
  <nav class="tiles" id="mainNav" aria-label="ניווט ראשי">
    <button class="tile tile--inv"     data-view="inventory"><span class="tile__ico">📦</span><span class="tile__t">עדכון מלאי</span><span class="tile__s">העלאת רשימות ודוח תנועות</span></button>
    <button class="tile tile--orders"  data-view="orders"><span class="tile__ico">🧾</span><span class="tile__t">מצב הזמנות</span><span class="tile__s">סטטוסים וזמנים בלייב</span></button>
    <button class="tile tile--pack"    data-view="packing"><span class="tile__ico">🎁</span><span class="tile__t">אריזה</span><span class="tile__s">משמרת אורזים ומדבקות</span></button>
    <button class="tile tile--ship"    data-view="shipping"><span class="tile__ico">🚚</span><span class="tile__t">משלוח</span><span class="tile__s">כתובות וזמני הובלה</span></button>
    <button class="tile tile--rep"     data-view="reports"><span class="tile__ico">📊</span><span class="tile__t">דוחות</span><span class="tile__s">יתרות, מכירות וגביה אשראי</span></button>
    <button class="tile tile--link"    data-view="orderlink"><span class="tile__ico">🔗</span><span class="tile__t">לינק הזמנה</span><span class="tile__s">קליטת הזמנה חדשה</span></button>
  </nav>

  <!-- Live dashboard: orders in process -->
  <section class="panel" id="livePanel">
    <div class="panel__head">
      <h3>מצב הזמנות בתהליך - לייב</h3>
      <span class="dot dot--live">● עדכון חי</span>
    </div>
    <div class="table-wrap">
      <table class="tbl" id="liveOrdersTbl">
        <thead>
          <tr>
            <th>הזמנה</th><th>לקוח</th><th>פריטים</th><th>סכום</th><th>סטטוס</th>
            <th>זמן מאישור התשלום</th><th>קבלה</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <!-- Live dashboard: stock availability -->
  <section class="panel" id="stockPanel">
    <div class="panel__head">
      <h3>זמינות מלאי כעת</h3>
      <span class="muted" id="stockUpdated"></span>
    </div>
    <div class="table-wrap">
      <table class="tbl" id="liveStockTbl">
        <thead>
          <tr><th>פריט</th><th>מק"ט</th><th>ברקוד</th><th>זמין במלאי</th><th>שמור להזמנות</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <!-- Generic view modal -->
  <div class="modal" id="modal" hidden>
    <div class="modal__backdrop" data-close></div>
    <div class="modal__card" role="dialog" aria-modal="true">
      <div class="modal__head">
        <h3 id="modalTitle"></h3>
        <button class="modal__x" data-close aria-label="סגירה">✕</button>
      </div>
      <div class="modal__body" id="modalBody"></div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast" hidden></div>

  <footer class="foot">
    <span>LEGO-LAND · מערכת ניהול מכירות</span>
    <button id="resetDemo" class="btn btn--tiny btn--ghost">איפוס נתוני הדגמה</button>
  </footer>

  <script src="js/db.js"></script>
  <script src="js/excel.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
    }
  </script>
</body>
</html>
